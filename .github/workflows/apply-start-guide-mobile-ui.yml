name: Apply start guide mobile UI fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-start-guide-mobile-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply mobile-first modal and floating navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path("start_guide/js/script.js")
          css_path = Path("start_guide/css/style.css")

          js = js_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          js_marker = "// スマホ向けモーダル・固定目次"
          if js_marker not in js:
              js += r'''

// スマホ向けモーダル・固定目次
let mobileModalScrollY = 0;

function openServiceInfoModal(serviceId, trigger) {
  const service = getServiceById(serviceId);
  if (!service || !elements.serviceInfoModal) return;

  state.previousFocus = trigger || document.activeElement;
  elements.serviceInfoModalTitle.textContent = `${service.name}の詳細`;
  elements.serviceInfoModalBody.innerHTML = buildModalBody(service);
  elements.serviceInfoModal.classList.remove("hidden");
  elements.serviceInfoModal.setAttribute("aria-hidden", "false");

  mobileModalScrollY = window.scrollY;
  document.body.style.position = "fixed";
  document.body.style.top = `-${mobileModalScrollY}px`;
  document.body.style.right = "0";
  document.body.style.left = "0";
  document.body.style.width = "100%";
  document.body.classList.add("service-info-modal-open");

  window.requestAnimationFrame(() => {
    elements.serviceInfoModal.querySelector(".service-info-modal-close")?.focus();
  });
}

function closeServiceInfoModal() {
  if (!elements.serviceInfoModal || elements.serviceInfoModal.classList.contains("hidden")) return;

  elements.serviceInfoModal.classList.add("hidden");
  elements.serviceInfoModal.setAttribute("aria-hidden", "true");
  document.body.classList.remove("service-info-modal-open");
  document.body.style.position = "";
  document.body.style.top = "";
  document.body.style.right = "";
  document.body.style.left = "";
  document.body.style.width = "";

  const previousScrollBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = "auto";
  window.scrollTo(0, mobileModalScrollY);
  document.documentElement.style.scrollBehavior = previousScrollBehavior;

  state.previousFocus?.focus?.({ preventScroll: true });
  state.previousFocus = null;
}

function handleMobileModalTabTrap(event) {
  if (event.key !== "Tab" || !elements.serviceInfoModal || elements.serviceInfoModal.classList.contains("hidden")) return;

  const focusable = [...elements.serviceInfoModal.querySelectorAll(
    'button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
  )].filter((item) => item instanceof HTMLElement && item.offsetParent !== null);

  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];

  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}

document.addEventListener("keydown", handleMobileModalTabTrap);

function setupStickyToc() {
  const detailedToc = document.querySelector(".page-toc");
  const detailedLinks = [...document.querySelectorAll(".page-toc-link")];
  if (!detailedToc || !detailedLinks.length) return;

  const compactLabels = {
    "#firstGuideSection": "初めてガイド",
    "#serviceFinderSection": "応援を探す",
    "#purchaseGuideSection": "購入ガイド"
  };

  const floatingToc = document.createElement("nav");
  floatingToc.className = "floating-toc";
  floatingToc.setAttribute("aria-label", "固定ページ内メニュー");
  floatingToc.setAttribute("aria-hidden", "true");
  floatingToc.innerHTML = `
    <div class="floating-toc-scroll">
      ${detailedLinks.map((link) => {
        const href = link.getAttribute("href") || "";
        const label = compactLabels[href] || link.querySelector("strong")?.textContent?.trim() || "移動";
        return `<a class="floating-toc-link" href="${escapeAttribute(href)}" tabindex="-1">${escapeHtml(label)}</a>`;
      }).join("")}
    </div>
  `;
  document.body.appendChild(floatingToc);

  const floatingLinks = [...floatingToc.querySelectorAll(".floating-toc-link")];
  const allLinks = [...detailedLinks, ...floatingLinks];
  const targets = detailedLinks
    .map((link) => document.querySelector(link.getAttribute("href")))
    .filter(Boolean);

  function setActiveLink(href) {
    allLinks.forEach((link) => {
      const active = link.getAttribute("href") === href;
      link.classList.toggle("active", active);
      active ? link.setAttribute("aria-current", "location") : link.removeAttribute("aria-current");
    });
  }

  allLinks.forEach((link) => {
    link.addEventListener("click", () => setActiveLink(link.getAttribute("href")));
  });

  let frameId = 0;
  function updateFloatingToc() {
    frameId = 0;

    const shouldShow = window.scrollY > 80 && detailedToc.getBoundingClientRect().bottom <= 8;
    floatingToc.classList.toggle("is-visible", shouldShow);
    floatingToc.setAttribute("aria-hidden", String(!shouldShow));
    floatingLinks.forEach((link) => { link.tabIndex = shouldShow ? 0 : -1; });
    document.body.classList.toggle("floating-toc-visible", shouldShow);

    const topOffset = 90;
    let currentTarget = targets[0];
    targets.forEach((target) => {
      if (target.getBoundingClientRect().top <= topOffset) currentTarget = target;
    });
    if (currentTarget) setActiveLink(`#${currentTarget.id}`);
  }

  function scheduleUpdate() {
    if (frameId) return;
    frameId = window.requestAnimationFrame(updateFloatingToc);
  }

  window.addEventListener("scroll", scheduleUpdate, { passive: true });
  window.addEventListener("resize", scheduleUpdate, { passive: true });
  updateFloatingToc();
}
'''

          css_marker = "/* スマホ向けモーダル・固定目次・表示安定化 */"
          if css_marker not in css:
              css += r'''

/* スマホ向けモーダル・固定目次・表示安定化 */
.service-info-modal{align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom))}.service-info-modal-dialog{width:min(100%,620px);max-height:88vh;max-height:min(88dvh,720px);border-radius:20px}.service-info-modal-header{flex-shrink:0}.service-info-modal-body{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.service-info-modal-close{width:44px;height:44px}.service-info-button,.app-store-link{min-height:44px}.floating-toc{position:fixed;top:0;right:0;left:0;z-index:90;padding:max(6px,env(safe-area-inset-top)) 8px 6px;border-bottom:1px solid rgba(2,185,165,.2);background:rgba(255,255,255,.96);box-shadow:0 8px 24px rgba(28,75,69,.12);backdrop-filter:blur(16px);transform:translateY(-110%);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease}.floating-toc.is-visible{transform:translateY(0);opacity:1;pointer-events:auto}.floating-toc-scroll{width:min(100%,720px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 auto}.floating-toc-link{min-width:0;min-height:44px;display:flex;align-items:center;justify-content:center;padding:7px 4px;border:1px solid transparent;border-radius:12px;color:var(--color-text-sub);font-size:11px;font-weight:700;line-height:1.25;text-align:center;text-decoration:none;white-space:nowrap}.floating-toc-link.active{border-color:rgba(2,185,165,.28);color:var(--color-brand-dark);background:var(--color-brand-soft)}body.floating-toc-visible .page-anchor,body.floating-toc-visible #resultSection{scroll-margin-top:calc(66px + env(safe-area-inset-top))}body.service-info-modal-open .floating-toc{opacity:0;pointer-events:none}.service-data-card,.service-card,.result-card,.purchase-shop-link{min-width:0;overflow-wrap:anywhere}.twitter-tweet{max-width:100%!important;margin-right:auto!important;margin-left:auto!important}@media(max-width:480px){.service-info-modal-header{padding:10px 12px}.service-info-modal-body{padding:14px}.result-card-top{flex-wrap:wrap}.result-card-top>div{min-width:0;flex:1 1 100%}.floating-toc-link{font-size:10.5px}}@media(max-width:360px){.floating-toc{padding-right:5px;padding-left:5px}.floating-toc-scroll{gap:4px}.floating-toc-link{font-size:10px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.floating-toc{transition:none}}
'''

          js_path.write_text(js, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          PY

      - name: Validate JavaScript
        run: node --check start_guide/js/script.js

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add start_guide/js/script.js start_guide/css/style.css
          git commit -m "スタートガイドのスマホ向けモーダルと固定目次を改善"
          git push
