name: Apply start guide mobile UI fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-start-guide-mobile-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update start guide UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path("start_guide/js/script.js")
          css_path = Path("start_guide/css/style.css")
          html_path = Path("start_guide/index.html")

          js = js_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")
          html = html_path.read_text(encoding="utf-8")

          if "modalScrollY" not in js:
              js = js.replace(
                  "  previousFocus: null\n};",
                  "  previousFocus: null,\n  modalScrollY: 0\n};",
                  1,
              )

          js = js.replace(
              '  document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeServiceInfoModal(); });',
              '  document.addEventListener("keydown", handleModalKeydown);',
              1,
          )

          modal_pattern = re.compile(
              r"function openServiceInfoModal\(serviceId, trigger\) \{.*?\n\}\nfunction closeServiceInfoModal\(\) \{.*?\n\}\nfunction buildModalBody",
              re.S,
          )
          modal_replacement = r'''function openServiceInfoModal(serviceId, trigger) {
  const service = getServiceById(serviceId);
  if (!service || !elements.serviceInfoModal) return;
  const wasHidden = elements.serviceInfoModal.classList.contains("hidden");
  state.previousFocus = trigger || document.activeElement;
  elements.serviceInfoModalTitle.textContent = `${service.name}の詳細`;
  elements.serviceInfoModalBody.innerHTML = buildModalBody(service);
  elements.serviceInfoModal.classList.remove("hidden");
  elements.serviceInfoModal.setAttribute("aria-hidden", "false");
  if (wasHidden) {
    state.modalScrollY = window.scrollY;
    document.body.style.position = "fixed";
    document.body.style.top = `-${state.modalScrollY}px`;
    document.body.style.width = "100%";
  }
  document.body.classList.add("service-info-modal-open");
  window.requestAnimationFrame(() => elements.serviceInfoModal.querySelector(".service-info-modal-close")?.focus());
}
function closeServiceInfoModal() {
  if (!elements.serviceInfoModal || elements.serviceInfoModal.classList.contains("hidden")) return;
  elements.serviceInfoModal.classList.add("hidden");
  elements.serviceInfoModal.setAttribute("aria-hidden", "true");
  document.body.classList.remove("service-info-modal-open");
  document.body.style.position = "";
  document.body.style.top = "";
  document.body.style.width = "";
  const previousScrollBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = "auto";
  window.scrollTo(0, state.modalScrollY);
  document.documentElement.style.scrollBehavior = previousScrollBehavior;
  state.previousFocus?.focus?.({ preventScroll: true });
  state.previousFocus = null;
}
function handleModalKeydown(event) {
  if (!elements.serviceInfoModal || elements.serviceInfoModal.classList.contains("hidden")) return;
  if (event.key === "Escape") {
    event.preventDefault();
    closeServiceInfoModal();
    return;
  }
  if (event.key !== "Tab") return;
  const focusable = [...elements.serviceInfoModal.querySelectorAll('button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')]
    .filter((item) => item instanceof HTMLElement && item.offsetParent !== null);
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}
function buildModalBody'''
          js, modal_count = modal_pattern.subn(modal_replacement, js, count=1)
          if modal_count != 1:
              raise RuntimeError(f"modal function replacement failed: {modal_count}")

          toc_pattern = re.compile(
              r"function setupStickyToc\(\) \{.*?\n\}\nfunction sanitizeHtml",
              re.S,
          )
          toc_replacement = r'''function setupStickyToc() {
  const detailedToc = document.querySelector(".page-toc");
  const detailedLinks = [...document.querySelectorAll(".page-toc-link")];
  if (!detailedToc || !detailedLinks.length) return;

  const compactLabels = {
    "#firstGuideSection": "初めてガイド",
    "#serviceFinderSection": "応援を探す",
    "#purchaseGuideSection": "購入ガイド"
  };
  const floatingToc = document.createElement("nav");
  floatingToc.className = "floating-toc";
  floatingToc.setAttribute("aria-label", "固定ページ内メニュー");
  floatingToc.setAttribute("aria-hidden", "true");
  floatingToc.innerHTML = `<div class="floating-toc-scroll">${detailedLinks.map((link) => {
    const href = link.getAttribute("href") || "";
    const number = link.querySelector(".page-toc-number")?.textContent?.trim() || "";
    const label = compactLabels[href] || link.querySelector("strong")?.textContent?.trim() || "移動";
    return `<a class="floating-toc-link" href="${escapeAttribute(href)}" tabindex="-1"><span class="floating-toc-number">${escapeHtml(number)}</span><span class="floating-toc-label">${escapeHtml(label)}</span></a>`;
  }).join("")}</div>`;
  document.body.appendChild(floatingToc);

  const floatingLinks = [...floatingToc.querySelectorAll(".floating-toc-link")];
  const allLinks = [...detailedLinks, ...floatingLinks];
  const targets = detailedLinks
    .map((link) => document.querySelector(link.getAttribute("href")))
    .filter(Boolean);

  function setActiveLink(href) {
    allLinks.forEach((link) => {
      const active = link.getAttribute("href") === href;
      link.classList.toggle("active", active);
      active ? link.setAttribute("aria-current", "location") : link.removeAttribute("aria-current");
    });
  }

  allLinks.forEach((link) => link.addEventListener("click", () => setActiveLink(link.getAttribute("href"))));
  setActiveLink(detailedLinks[0].getAttribute("href"));

  let visibilityFrame = 0;
  function updateFloatingVisibility() {
    visibilityFrame = 0;
    const visible = window.scrollY > 80 && detailedToc.getBoundingClientRect().bottom <= 8;
    floatingToc.classList.toggle("is-visible", visible);
    floatingToc.setAttribute("aria-hidden", String(!visible));
    floatingLinks.forEach((link) => { link.tabIndex = visible ? 0 : -1; });
    document.body.classList.toggle("floating-toc-visible", visible);
  }
  function scheduleVisibilityUpdate() {
    if (visibilityFrame) return;
    visibilityFrame = window.requestAnimationFrame(updateFloatingVisibility);
  }
  window.addEventListener("scroll", scheduleVisibilityUpdate, { passive: true });
  window.addEventListener("resize", scheduleVisibilityUpdate, { passive: true });
  updateFloatingVisibility();

  if (!("IntersectionObserver" in window)) return;
  const observer = new IntersectionObserver((entries) => {
    const visible = entries
      .filter((entry) => entry.isIntersecting)
      .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (!visible) return;
    setActiveLink(`#${visible.target.id}`);
  }, { rootMargin: "-72px 0px -62% 0px", threshold: [0.05, 0.25, 0.5] });
  targets.forEach((target) => observer.observe(target));
}
function sanitizeHtml'''
          js, toc_count = toc_pattern.subn(toc_replacement, js, count=1)
          if toc_count != 1:
              raise RuntimeError(f"toc function replacement failed: {toc_count}")

          marker = "/* スマホ向けモーダル・固定目次・表示安定化 */"
          if marker not in css:
              css += r'''

/* スマホ向けモーダル・固定目次・表示安定化 */
.service-info-modal{align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom))}.service-info-modal-dialog{width:min(100%,620px);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));border-radius:20px}.service-info-modal-body{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.floating-toc{position:fixed;top:0;right:0;left:0;z-index:90;padding:max(6px,env(safe-area-inset-top)) 8px 6px;background:rgba(255,255,255,.96);border-bottom:1px solid rgba(2,185,165,.2);box-shadow:0 8px 24px rgba(28,75,69,.12);backdrop-filter:blur(16px);transform:translateY(-110%);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease}.floating-toc.is-visible{transform:translateY(0);opacity:1;pointer-events:auto}.floating-toc-scroll{width:min(100%,720px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 auto}.floating-toc-link{min-width:0;min-height:44px;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 6px;border:1px solid transparent;border-radius:12px;color:var(--color-text-sub);background:transparent;font-size:11px;font-weight:700;line-height:1.25;text-align:center;text-decoration:none}.floating-toc-link.active{border-color:rgba(2,185,165,.28);color:var(--color-brand-dark);background:var(--color-brand-soft)}.floating-toc-number{flex-shrink:0;color:var(--color-text-muted);font-size:9px;letter-spacing:.04em}.floating-toc-label{min-width:0;white-space:nowrap}.floating-toc-link:focus-visible{outline:3px solid rgba(2,185,165,.3);outline-offset:1px}body.floating-toc-visible .page-anchor,body.floating-toc-visible #resultSection{scroll-margin-top:calc(66px + env(safe-area-inset-top))}body.service-info-modal-open .floating-toc{opacity:0;pointer-events:none}.service-data-card,.service-card,.result-card,.purchase-shop-link{min-width:0;overflow-wrap:anywhere}.twitter-tweet{max-width:100%!important;margin-right:auto!important;margin-left:auto!important}@media(max-width:480px){.service-info-modal-header{padding:12px 14px}.service-info-modal-body{padding:14px}.result-card-top{flex-wrap:wrap}.floating-toc-link{padding-right:4px;padding-left:4px}.floating-toc-number{display:none}}@media(max-width:360px){.floating-toc{padding-right:5px;padding-left:5px}.floating-toc-scroll{gap:4px}.floating-toc-link{font-size:10px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.floating-toc{transition:none}}
'''

          html = html.replace(
              '<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">',
              '<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">',
              1,
          )
          css = css.replace(
              '@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap");\n',
              "",
              1,
          )

          js_path.write_text(js, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          html_path.write_text(html, encoding="utf-8")
          PY

      - name: Validate JavaScript
        run: node --check start_guide/js/script.js

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add start_guide/index.html start_guide/js/script.js start_guide/css/style.css
          git commit -m "スタートガイドのスマホ向けモーダルと固定目次を改善"
          git push
